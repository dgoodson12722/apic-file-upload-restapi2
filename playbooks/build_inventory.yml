---
# Interactive inventory.yml builder for the ACI upgrade toolkit.
#
# Prompts for the local directory containing your image files, then for
# each of the three expected images (APIC ISO, NX-OS 64-bit, NX-OS
# 32-bit): asks for the filename, finds it in that directory, and computes
# its MD5 automatically -- no need to type a hash by hand. Writes (and
# OVERWRITES) ../inventory.yml with the result, which both
# 00_check_apic_health.yml and 01_copy_and_verify_images.yml then read.
#
# If a file isn't found locally, that image's reference_md5 is left blank
# in the generated inventory.yml (with a console warning) rather than
# failing the run -- you can fix the path and re-run.
#
# Usage:
#   ansible-playbook playbooks/build_inventory.yml
#
# Requirements: ansible-core 2.20.1 / Python 3.14 compatible.
# (Tested in this form against ansible-core 2.20.1 on Python 3.13, the
# closest available to 3.14; nothing in this playbook is Python-version
# sensitive -- it's plain YAML/Jinja2 -- so the result applies to 3.14 too.)

- name: Build inventory.yml from local image files
  hosts: localhost
  gather_facts: false
  vars_prompt:
    - name: local_image_dir
      prompt: "Local directory containing the image files"
      private: false

    - name: apic_iso_filename
      prompt: "APIC ISO filename"
      private: false

    - name: nxos64_filename
      prompt: "NX-OS 64-bit image filename"
      private: false

    - name: nxos32_filename
      prompt: "NX-OS 32-bit image filename"
      private: false

  tasks:
    - name: Build the raw image list from the prompted filenames
      ansible.builtin.set_fact:
        _raw_images:
          - label: "APIC ISO"
            filename: "{{ apic_iso_filename }}"
          - label: "NX-OS 64-bit"
            filename: "{{ nxos64_filename }}"
          - label: "NX-OS 32-bit"
            filename: "{{ nxos32_filename }}"

    - name: Compute the MD5 of each local image file
      ansible.builtin.include_tasks: ../tasks/hash_one_image.yml
      loop: "{{ _raw_images }}"
      loop_control:
        label: "{{ item.label }}"
        loop_var: item

    - name: Print what will be written
      ansible.builtin.debug:
        msg: >-
          {{ item.label }} ({{ item.filename }}):
          {{ 'md5=' + item.reference_md5 if item.reference_md5 | length > 0 else 'FILE NOT FOUND -- reference_md5 left blank' }}
      loop: "{{ generated_images }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Render the new inventory.yml content
      ansible.builtin.set_fact:
        _inventory_yaml_content: |-
          ---
          # Pre-configured image inventory for the ACI upgrade toolkit.
          #
          # Generated by playbooks/build_inventory.yml from the local image
          # files in {{ local_image_dir }} -- re-run that script to regenerate,
          # or edit this file by hand. Used by both:
          #   playbooks/00_check_apic_health.yml      (images-present + checksum check)
          #   playbooks/01_copy_and_verify_images.yml (copy + verify)
          #
          # filename:      the image's filename as you have it locally (and as it
          #                was originally named by Cisco). Matching against the
          #                APIC's firmware repository is done by filename STEM
          #                (ignoring the extension), since the repository doesn't
          #                always list an image under the same extension you have
          #                locally.
          # reference_md5: the MD5 of the local file, computed automatically when
          #                this was generated. Blank means the file wasn't found
          #                locally at generation time -- re-run build_inventory.yml
          #                once it's in place to fill it in.

          images:
          {% for image in generated_images %}
            - label: "{{ image.label }}"
              filename: "{{ image.filename }}"
              reference_md5: "{{ image.reference_md5 }}"
          {% endfor %}

    - name: Write ../inventory.yml (overwrites any existing file)
      ansible.builtin.copy:
        content: "{{ _inventory_yaml_content }}\n"
        dest: "{{ playbook_dir }}/../inventory.yml"
        mode: "0644"

    - name: Confirm
      ansible.builtin.debug:
        msg: "inventory.yml written to {{ playbook_dir }}/../inventory.yml"
